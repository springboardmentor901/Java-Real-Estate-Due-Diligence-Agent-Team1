spring.application.name=due-diligence-agent

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/realestate}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ATTOM API
attom.api-key=${ATTOM_API_KEY}

# REGRID API
regrid.api-token=${REGRID_API_TOKEN}

# FEMA NFHL API
FEMA_NFHL_BASE_URL=https://hazards.fema.gov/arcgis/rest/services/public/NFHL/MapServer

# EPA Envirofacts API
EPA_ENVIROFACTS_BASE_URL=https://frs-public.epa.gov/ords/frs_public2/frs_rest_services.get_facilities

# SHOVELS API
SHOVELS_API_KEY=${SHOVELS_API_KEY}

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# RapidAPI
rapidapi.key=${RAPIDAPI_KEY}
rapidapi.host=${X_RAPIDAPI_HOST:realtor-search.p.rapidapi.com}